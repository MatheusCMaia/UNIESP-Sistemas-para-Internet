<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro</title>
</head>
<body>

    <header>
        <h1>Cadastro de Usuários</h1>
        <img src="imagens/logo.png" alt="Logo do Sistema de Cadastro">
    </header>

    <main>

        <h2>Formulário de Cadastro</h2>

        <form action="#" method="post">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            <br><br>

            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" name="sobrenome" required>
            <br><br>

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco" required>
            <br><br>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" required>
            <br><br>

            <p>Sexo:</p>

            <input type="radio" id="masculino" name="sexo" value="Masculino">
            <label for="masculino">Masculino</label>

            <input type="radio" id="feminino" name="sexo" value="Feminino">
            <label for="feminino">Feminino</label>

            <br><br>

            <p>Interesses:</p>

            <input type="checkbox" id="tecnologia" name="interesses" value="Tecnologia">
            <label for="tecnologia">Tecnologia</label>

            <input type="checkbox" id="educacao" name="interesses" value="Educação">
            <label for="educacao">Educação</label>

            <input type="checkbox" id="esportes" name="interesses" value="Esportes">
            <label for="esportes">Esportes</label>

            <br><br>

            <button type="submit">Enviar Cadastro</button>

        </form>

        <hr>

        <h2>Usuários Cadastrados</h2>

        <table border="1">
            <caption>Lista de Usuários</caption>

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Profissão</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Matheus Augusto</td>
                    <td>22</td>
                    <td>Desenvolvedor</td>
                </tr>

                <tr>
                    <td>Leandro</td>
                    <td>30</td>
                    <td>Professor</td>
                </tr>

                <tr>
                    <td>Pedro Oliveira</td>
                    <td>28</td>
                    <td>Analista de Redes</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="3">Total de usuários: 3</td>
                </tr>
            </tfoot>

        </table>

        <br>

        <a href="view/pagina2.html">Ir para a Página Secundária</a>

    </main>

</body>
</html>
