<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Alterar dados</title>
</head>
<body>
    <h1>Alterar dados</h1>
    <h2>Preencha seus novos dados</h2>
    <label>Digite seu novo nome:</label>
    <input type="text" id="nome" required>
    <br><br>
    <label>Digite seu novo e-mail:</label>
    <input type="text" id="email" required>
    <br><br>
    <label>Digite seu novo endereço:</label>
    <input type="text" id="endereco" required>
    <br><br>
    <label>Digite sua nova cidade:</label>
    <input type="text" id="cidade" required>
    <br><br>
    <label>Digite seu novo telefone:</label>
    <input type="text" id="ddd" required size="1"><input type="text" id="numero" required>
    <br><br>
    <label>Digite seu novo nome de usuário:</label>
    <input type="text" id="usuario" required>
    <br><br>
    <label>Digite sua nova senha:</label>
    <input type="text" id="senha" required>
    <br><br>
    <a href="../index.html">
    <button type="submit">Finalizar alteração dos dados</button>
    </a>
</body>
</html>
